<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hatóanyag tanuló"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Hatóanyag tanuló</title><style>
:root{--bg:#f7f4ef;--card:#fffdf9;--ink:#292820;--muted:#6d6b62;--accent:#3e6b5b;--pale:#e4eee8;--border:#e3ded4;--good:#286646;--bad:#9c3b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.45}main{max-width:720px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 15px calc(30px + env(safe-area-inset-bottom))}h1{margin:0;font-size:1.8rem}header p,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:17px;margin:13px 0}label{display:block;font-weight:700;margin:0 0 6px}select,button{font:inherit}select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:white;margin-bottom:12px}.btn{border:0;border-radius:13px;padding:13px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:var(--pale)}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;font-weight:700}.question{font-size:1.2rem;font-weight:750;white-space:pre-line;margin:18px 0}.options{display:grid;gap:9px}.option{padding:13px;text-align:left;background:white;border:1px solid var(--border);border-radius:12px}.option:disabled{opacity:1}.correct{background:#eaf5ed!important;border-color:var(--good)!important}.incorrect{background:#fbeeed!important;border-color:var(--bad)!important}.feedback{white-space:pre-line;margin-top:13px}.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}.tag{display:inline-block;background:var(--pale);padding:4px 9px;border-radius:20px;font-size:.82rem;margin:4px 4px 0 0}footer{text-align:center;color:var(--muted);font-size:.8rem}
</style></head><body><main><header><h1>Hatóanyag tanuló</h1><p>Gyakorlás a saját kezelési terved alapján</p></header><section class="card" id="setup"><label for="mode">Kikérdezés módja</label><select id="mode"><option value="both">Mindkét irány, véletlenszerűen</option><option value="ingredient">Hatóanyag → bőrtípus</option><option value="skin">Bőrtípus → hatóanyag</option><option value="step">Kezelési lépés → hatóanyag</option><option value="ingredientStep">Hatóanyag → kezelési lépés</option></select><label for="count">Kérdések száma</label><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select><button class="btn primary" id="start">Gyakorlás indítása</button><p class="muted" id="info"></p></section><section class="card hidden" id="quiz"><div class="stats"><span id="progress"></span><span id="score"></span></div><div id="tags"></div><div class="question" id="prompt"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="row" style="margin-top:15px"><button class="btn secondary" id="quit">Vissza</button><button class="btn primary" id="next" disabled>Következő</button></div></section><section class="card hidden" id="result"><h2>Gyakorlás vége</h2><p id="resultText"></p><button class="btn primary" id="again">Új gyakorlás</button></section><section class="card"><b>Offline használat</b><p class="muted">Az első online megnyitás után az alkalmazás fájljai gyorsítótárba kerülhetnek, és ezután internet nélkül is működhet. A forrás ritka elnevezéseit ellenőrizd az eredeti jegyzetedben.</p></section><footer>Hatóanyag tanuló</footer></main><script src="data.js"></script><script>
const $=x=>document.getElementById(x);let queue=[],wrong=[],q=null,score=0,answered=0,total=0,repeat=false;const uniq=a=>[...new Set(a)];function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function init(){let d=window.STUDY_DATA||[];$('info').textContent=`Beépített adatbázis: ${d.length} kapcsolat · ${uniq(d.map(x=>x.ingredient)).length} hatóanyag`;if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}function right(x){return x.mode==='ingredient'?x.skin:(x.mode==='ingredientStep'?(x.step||'Nincs megadva'):x.ingredient)}function ask(x){if(x.mode==='ingredient')return`Melyik bőrtípushoz kapcsolódik?

${x.ingredient}`;if(x.mode==='skin')return`Melyik hatóanyag szerepel ennél a bőrtípusnál?

${x.skin}`;if(x.mode==='step')return`Melyik hatóanyag szerepel ennél a lépésnél?

${x.step} (${x.skin})`;return`Melyik kezelési lépésnél szerepel?

${x.ingredient} — ${x.skin}`}function opts(x){let f=x.mode==='ingredient'?'skin':x.mode==='ingredientStep'?'step':'ingredient',pool=uniq(STUDY_DATA.map(y=>f==='step'?(y.step||'Nincs megadva'):y[f])).filter(y=>y!==right(x)),a=[right(x)];while(a.length<4&&pool.length)a.push(pool.splice(Math.random()*pool.length|0,1)[0]);while(a.length<4)a.push('Egyéb');return a.sort(()=>Math.random()-.5)}function start(){let d=STUDY_DATA,n=+$('count').value;queue=[];for(let i=0;i<n;i++){let x=d[Math.random()*d.length|0],m=$('mode').value;queue.push({...x,mode:m==='both'?(Math.random()<.5?'ingredient':'skin'):m})}queue.sort(()=>Math.random()-.5);wrong=[];score=answered=0;total=n;repeat=false;$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){if(!queue.length){if(wrong.length&&!repeat){queue=wrong.slice();wrong=[];repeat=true;render();return}finish();return}q=queue.shift();q.correct=right(q);q.done=false;$('progress').textContent=`${Math.min(answered+1,total)} / ${total}${repeat?' · ismétlés':''}`;$('score').textContent=`Pontszám: ${score} / ${total}`;$('tags').innerHTML=`<span class="tag">${esc(q.skin)}</span>${q.step?`<span class="tag">${esc(q.step)}</span>`:''}`;$('prompt').textContent=ask(q);$('options').innerHTML='';opts(q).forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent=`${i+1}. ${v}`;b.onclick=()=>answer(v,b);$('options').appendChild(b)});$('feedback').textContent='';$('next').disabled=true}function answer(v,b){if(q.done)return;q.done=true;let ok=v===q.correct;[...$('options').children].forEach(x=>{x.disabled=true;if(x.textContent.slice(3)===q.correct)x.classList.add('correct')});if(ok){if(!repeat)score++;$('feedback').innerHTML='<span class="good">✓ Helyes válasz!</span>\n'+esc(q.explanation||'A forrás nem tartalmaz külön magyarázatot.')}else{b.classList.add('incorrect');$('feedback').innerHTML='<span class="bad">✗ Helyes válasz: '+esc(q.correct)+'</span>\n'+esc(q.explanation||'A forrás nem tartalmaz külön magyarázatot.');if(!repeat)wrong.push(q)}answered++;$('score').textContent=`Pontszám: ${score} / ${total}`;$('next').disabled=false}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultText').textContent=`Első kör eredménye: ${score}/${total} (${Math.round(score/total*100)}%). ${repeat?'A hibás kérdések ismétlése is befejeződött.':'Nem volt hibás válasz.'}`} $('start').onclick=start;$('next').onclick=render;$('quit').onclick=()=>{$('quiz').classList.add('hidden');$('setup').classList.remove('hidden')};$('again').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden')};init();</script></body></html>
